services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_ENGINE_URL: ${VITE_ENGINE_URL:-/engine}
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - engine

  engine:
    build:
      context: ./poc4
      dockerfile: Dockerfile.engine
    environment:
      COLORIAGE_DEFAULT_MAX_SIDE: ${COLORIAGE_DEFAULT_MAX_SIDE:-1200}
      COLORIAGE_ENGINE_HOST: 0.0.0.0
      COLORIAGE_ENGINE_PORT: 8765
      COLORIAGE_MAX_DETAIL_POINTS: ${COLORIAGE_MAX_DETAIL_POINTS:-12000}
      COLORIAGE_MAX_DETAIL_ZONES: ${COLORIAGE_MAX_DETAIL_ZONES:-64}
      COLORIAGE_MAX_IMAGE_MB: ${COLORIAGE_MAX_IMAGE_MB:-40}
      COLORIAGE_MAX_REQUEST_MB: ${COLORIAGE_MAX_REQUEST_MB:-64}
      COLORIAGE_MAX_SIDE_LIMIT: ${COLORIAGE_MAX_SIDE_LIMIT:-2400}
      U2NET_HOME: /models/rembg
    volumes:
      - rembg-models:/models/rembg
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    depends_on:
      - frontend
      - engine
    ports:
      - "${COLORIAGE_PUBLIC_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  rembg-models:

