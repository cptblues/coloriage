[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "coloriage-poc-lot2"
version = "0.2.0"
description = "POC de segmentation et fusion de régions coloriables pour A4/A3."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
]

[project.scripts]
coloriage-lot2 = "coloriage_lot2.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
